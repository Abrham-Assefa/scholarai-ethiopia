[project]
name = "scholarai-ai"
version = "0.1.0"
description = "AI modules for ScholarAI Ethiopia: CV maker, matcher, chat agent, essay coach"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.7",
    "httpx>=0.27",
    "reportlab>=4.1",
]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.5"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["scholarai_ai"]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
extend-per-file-ignores = { "scholarai_ai/collector/*" = ["E501"], "tests/test_collector.py" = ["E501"], "tests/test_events.py" = ["E501"] }  # long regex literals

[tool.pytest.ini_options]
testpaths = ["tests"]
