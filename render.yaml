services:
  - type: web
    name: scholarai-fastapi
    runtime: docker
    plan: free
    region: virginia
    dockerfilePath: ./services/api/Dockerfile
    dockerContext: .
    healthCheckPath: /health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: scholarai-db
          property: connectionString
      - key: ENV
        value: prod
      - key: JWT_SECRET
        generateValue: true
      - key: CORS_ORIGINS
        value: https://scholarai-ethiopia.onrender.com
      - key: COLLECTOR_ENABLED
        value: "false"
